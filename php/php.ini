memory_limit = 4G
max_execution_time = 1800
max_input_time = 1800
zlib.output_compression = Off
realpath_cache_size = 8M
realpath_cache_ttl = 600
session.gc_maxlifetime = 7200

; File uploads
file_uploads = On
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; Error handling
display_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php-errors.log

; Security
expose_php = Off
cgi.fix_pathinfo = 0
