; Magento 2 PHP-FPM pool overrides.
;
; Loaded last (zz- prefix) so it wins over the image default www.conf.
; The listen directive is pinned explicitly here so that the nginx upstream
; (fastcgi_backend -> php:9000) can never drift away from what FPM binds.

[www]
; Listen on all interfaces inside the container network namespace.
; nginx reaches this as "php:9000" over the compose network.
listen = 0.0.0.0:9000
listen.backlog = 4096

; Keep the container's env vars (Magento reads MAGE_MODE etc. from env)
clear_env = no

; Process manager sized for a Magento 2 developer stack
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 1000

; Health/status endpoints. ping.path is what the Docker HEALTHCHECK probes.
ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status

; Surface worker output in `docker logs` instead of swallowing it
catch_workers_output = yes
decorate_workers_output = no

; Magento long-running CLI/setup requests
request_terminate_timeout = 1800s
