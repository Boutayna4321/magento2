name: CI — Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl,gd,zip,xsl,bcmath,pcntl,dom,xml
      - name: Lint AlpineCommerce PHP files
        run: |
          find src/app/code/AlpineCommerce -name '*.php' -print0 | xargs -0 -n1 php -l

  xml-validation:
    name: XML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom,xml
      - name: Validate module.xml files
        run: |
          find src/app/code/AlpineCommerce -name 'module.xml' -print0 | xargs -0 -n1 php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }'
      - name: Validate layout XML files
        run: |
          find src/app/code/AlpineCommerce -path '*/layout/*.xml' -print0 | xargs -0 -n1 php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }'
      - name: Validate ui_component XML files
        run: |
          find src/app/code/AlpineCommerce -path '*/ui_component/*.xml' -print0 | xargs -0 -n1 php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }'
      - name: Validate db_schema.xml files
        run: |
          find src/app/code/AlpineCommerce -name 'db_schema.xml' -print0 | xargs -0 -n1 php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }'

  composer-validate:
    name: Composer Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer validate --no-check-publish --no-check-lock --no-interaction --working-dir=src
      - name: Composer security audit
        run: composer audit --locked --no-interaction --working-dir=src

  unit-tests:
    name: Unit Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: [composer-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl,gd,zip,xsl,bcmath,pcntl,dom,xml
          coverage: xdebug
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Configure Magento Composer credentials
        env:
          MAGENTO_PUBLIC_KEY: ${{ secrets.MAGENTO_PUBLIC_KEY }}
          MAGENTO_PRIVATE_KEY: ${{ secrets.MAGENTO_PRIVATE_KEY }}
        run: |
          if [ -n "$MAGENTO_PUBLIC_KEY" ] && [ -n "$MAGENTO_PRIVATE_KEY" ]; then
            printf '{"http-basic":{"repo.magento.com":{"username":"%s","password":"%s"}}}\n' \
              "$MAGENTO_PUBLIC_KEY" "$MAGENTO_PRIVATE_KEY" > src/auth.json
          fi
          if [ ! -f src/auth.json ]; then
            echo "::error::Set MAGENTO_PUBLIC_KEY and MAGENTO_PRIVATE_KEY secrets to install Magento dependencies."
            exit 1
          fi
      - name: Install dependencies
        working-directory: src
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Run unit tests
        working-directory: src/dev/tests/unit
        run: |
          ../../../vendor/bin/phpunit -c phpunit.xml.dist ../../../app/code/AlpineCommerce/CustomerCare/Test/Unit --coverage-clover build/coverage.xml --log-junit build/junit.xml
      - name: Static analysis (PHPStan)
        working-directory: src
        run: vendor/bin/phpstan analyse app/code/AlpineCommerce --level=0 --no-progress --memory-limit=1G
      - name: Coding standards (PHPCS, errors only)
        working-directory: src
        run: vendor/bin/phpcs --standard=Magento2 app/code/AlpineCommerce --warning-severity=0
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results
          path: src/dev/tests/unit/build/
          if-no-files-found: ignore

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [composer-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./php/Dockerfile
          push: false
          tags: magento2-alpinecommerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: markdownlint.json
          globs: |
            *.md
            !vendor/**
            !vendor.bak/**
            !node_modules/**
