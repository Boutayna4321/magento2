name: CI — Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl,gd,zip,xsl,bcmath,pcntl,dom,xml
      - name: Lint AlpineCommerce PHP files
        run: |
          find src/app/code/AlpineCommerce -name '*.php' -print0 | xargs -0 -n1 php -l

  xml-validation:
    name: XML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom,xml
      - name: Validate module.xml files
        run: |
          find src/app/code/AlpineCommerce -name 'module.xml' -print0 | xargs -0 -n1 php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }'
      - name: Validate layout XML files
        run: |
          find src/app/code/AlpineCommerce -path '*/layout/*.xml' -print0 | xargs -0 -n1 php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }'
      - name: Validate ui_component XML files
        run: |
          find src/app/code/AlpineCommerce -path '*/ui_component/*.xml' -print0 | xargs -0 -n1 php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }'
      - name: Validate db_schema.xml files
        run: |
          find src/app/code/AlpineCommerce -name 'db_schema.xml' -print0 | xargs -0 -n1 php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }'

  composer-validate:
    name: Composer Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer validate --no-check-publish --no-check-lock --no-interaction --working-dir=src
      - name: Composer security audit (informational: reports advisories in Magento dependencies)
        run: composer audit --locked --no-interaction --working-dir=src
        continue-on-error: true

  coding-standard:
    name: Coding Standard (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      # The Magento coding standard is on Packagist: no Marketplace keys needed.
      - name: Install the Magento coding standard
        working-directory: ${{ runner.temp }}
        run: |
          mkdir mcs && cd mcs && echo '{}' > composer.json
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --no-interaction --no-progress "magento/magento-coding-standard:^40"
      - name: PHPCS (Magento2 standard, errors only)
        run: ${{ runner.temp }}/mcs/vendor/bin/phpcs --standard=Magento2 --warning-severity=0 src/app/code/AlpineCommerce

  unit-tests:
    name: Unit Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: [composer-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl,gd,zip,xsl,bcmath,pcntl,dom,xml
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      # Installing Magento needs Marketplace keys (repo.magento.com). Without the
      # MAGENTO_PUBLIC_KEY / MAGENTO_PRIVATE_KEY secrets the job is skipped and says so;
      # with them, every following step must pass.
      - name: Configure Magento Composer credentials
        id: creds
        env:
          MAGENTO_PUBLIC_KEY: ${{ secrets.MAGENTO_PUBLIC_KEY }}
          MAGENTO_PRIVATE_KEY: ${{ secrets.MAGENTO_PRIVATE_KEY }}
        run: |
          if [ -n "$MAGENTO_PUBLIC_KEY" ] && [ -n "$MAGENTO_PRIVATE_KEY" ]; then
            printf '{"http-basic":{"repo.magento.com":{"username":"%s","password":"%s"}}}\n' \
              "$MAGENTO_PUBLIC_KEY" "$MAGENTO_PRIVATE_KEY" > src/auth.json
            echo "has_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MAGENTO_PUBLIC_KEY / MAGENTO_PRIVATE_KEY secrets are not set: unit tests skipped."
            echo "has_keys=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.creds.outputs.has_keys == 'true'
        working-directory: src
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Run unit tests
        if: steps.creds.outputs.has_keys == 'true'
        working-directory: src/dev/tests/unit
        run: |
          dirs=$(find ../../../app/code/AlpineCommerce -type d -path '*/Test/Unit')
          ../../../vendor/bin/phpunit -c phpunit.xml.dist --log-junit build/junit.xml $dirs
      # Informational only: phpstan.neon is kept out of the repository and the
      # bitexpert/phpstan-magento extension is not installed yet, so most findings are
      # false positives (factories, __() phrases, AbstractModel types).
      - name: Static analysis (PHPStan, informational)
        if: steps.creds.outputs.has_keys == 'true'
        working-directory: src
        run: vendor/bin/phpstan analyse app/code/AlpineCommerce --level=5 --no-progress --memory-limit=1G
        continue-on-error: true
      - name: Upload test results
        if: always() && steps.creds.outputs.has_keys == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results
          path: src/dev/tests/unit/build/
          if-no-files-found: ignore

  consumer-validation:
    name: Queue Consumer Validation
    runs-on: ubuntu-latest
    needs: [composer-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl,gd,zip,xsl,bcmath,pcntl,dom,xml
      - name: Validate queue_topology.xml files
        run: |
          find src/app/code/AlpineCommerce -name 'queue_topology.xml' -print0 | while IFS= read -r -d '' f; do
            php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }' "$f"
          done
      - name: Validate queue_publisher.xml files
        run: |
          find src/app/code/AlpineCommerce -name 'queue_publisher.xml' -print0 | while IFS= read -r -d '' f; do
            php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }' "$f"
          done
      - name: Validate queue_consumer.xml files
        run: |
          find src/app/code/AlpineCommerce -name 'queue_consumer.xml' -print0 | while IFS= read -r -d '' f; do
            php -r 'libxml_use_internal_errors(true); $x = simplexml_load_file($argv[1]); $e = libxml_get_errors(); if (!$x || $e) { foreach ($e as $err) { fwrite(STDERR, $err->message . "\n"); } exit(1); }' "$f"
          done
      - name: Verify all 4 consumers are registered
        run: |
          for consumer in alpincommerce_autoinvoice_async alpincommerce_partialinvoice_async alpincommerce_creditmemo_async alpincommerce_customercare_vip_async; do
            if ! grep -r "$consumer" src/app/code/AlpineCommerce --include="queue_consumer.xml" --quiet; then
              echo "FAIL: Consumer $consumer not found in any queue_consumer.xml"
              exit 1
            fi
            echo "OK: $consumer registered"
          done

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [composer-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./php
          file: ./php/Dockerfile
          push: false
          tags: magento2-alpinecommerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: markdownlint.json
          globs: |
            *.md
            !vendor/**
            !vendor.bak/**
            !node_modules/**
